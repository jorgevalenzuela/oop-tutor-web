# OOP Tutor Web — Production
# Target: NVIDIA DGX Spark — Ubuntu 24.04
# Students access via: https://tutor.cs.university.edu
#
# Ollama runs on HOST (not in Docker) for GPU access
# Start Ollama first: ollama serve
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml down
#   docker compose -f docker-compose.prod.yml logs -f

name: oop-tutor-prod

services:

  # ── RAG Backend ──────────────────────────
  rag-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oop-tutor-rag-prod
    restart: unless-stopped
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8001
      - ENV=production
    depends_on:
      - chroma
    networks:
      - oop-tutor-prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Assessment Backend ────────────────────
  assessment:
    build:
      context: ./assessment
      dockerfile: Dockerfile
    container_name: oop-tutor-assessment-prod
    restart: unless-stopped
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - EMAIL_FROM=${EMAIL_FROM}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3002
      - ENV=production
    volumes:
      - assessment-data-prod:/app/data
    networks:
      - oop-tutor-prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend + Internal Nginx ─────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_RAG_API_URL=
        - VITE_ASSESSMENT_API_URL=/assessment
    container_name: oop-tutor-frontend-prod
    restart: unless-stopped
    depends_on:
      - rag-backend
      - assessment
    networks:
      - oop-tutor-prod

  # ── Chroma Vector DB ─────────────────────
  chroma:
    image: chromadb/chroma:latest
    container_name: oop-tutor-chroma-prod
    restart: unless-stopped
    volumes:
      - chroma-data-prod:/chroma/chroma
    networks:
      - oop-tutor-prod

  # ── Nginx Reverse Proxy (public-facing) ──
  nginx-proxy:
    image: nginx:alpine
    container_name: oop-tutor-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - frontend
    networks:
      - oop-tutor-prod

volumes:
  assessment-data-prod:
  chroma-data-prod:
  nginx-logs:

networks:
  oop-tutor-prod:
    driver: bridge
